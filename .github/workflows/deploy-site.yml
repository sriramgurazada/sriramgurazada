name: Deploy site

# The portfolio is a static export, so it is rebuilt and republished whenever
# anything under site/ lands on main.
#
# This requires Pages to be enabled on the repository first, under
# Settings -> Pages -> Build and deployment -> Source -> GitHub Actions.
# A workflow cannot do it: configure-pages can only create the Pages site
# when given a token with administration:write, which GITHUB_TOKEN is not.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two publishes race. In-progress runs are allowed to finish so a
# deploy is not left half-applied.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        # Pages serves this repository from /<repo> rather than the domain
        # root. next.config.ts reads this to set basePath, and src/lib/asset.ts
        # uses it for the URLs Next does not rewrite itself.
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
